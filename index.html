<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>목포 건어물 장부</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">🐟</div>
    <h1>목포 건어물 장부</h1>
    <p class="login-desc">가게 구글 계정으로 로그인하세요</p>
    <button id="btn-google-login" class="btn-google">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      구글로 로그인
    </button>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app" class="hidden">

  <header class="app-header">
    <div class="header-left">
      <span class="header-icon">🐟</span>
      <span class="header-title" onclick="switchTab('home')" title="홈으로">목포 건어물 장부</span>
    </div>
    <div class="header-right">
      <span id="user-name" class="user-name"></span>
      <button id="btn-logout" class="btn-text-sm">로그아웃</button>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="home">🏠 홈</button>
    <button class="tab-btn" data-tab="bus">🚌 버스장부</button>
    <button class="tab-btn" data-tab="reservation">📅 예약일정</button>
    <button class="tab-btn" data-tab="purchase">📦 사입장부</button>
    <button class="tab-btn" data-tab="cashflow">💰 수입지출</button>
    <button class="tab-btn" data-tab="band">🏷️ 밴드관리</button>
    <button class="tab-btn" data-tab="search">🔍 검색</button>
  </nav>

  <main class="content-area">

    <!-- 홈 대시보드 -->
    <div id="tab-home" class="tab-panel active">
      <div class="panel-toolbar">
        <div class="date-nav">
          <button class="btn-icon" id="home-prev-month">◀</button>
          <span id="home-month-label" class="month-label"></span>
          <button class="btn-icon" id="home-next-month">▶</button>
        </div>
      </div>
      <div id="home-stats" class="home-stats-grid"></div>
      <div id="home-calendar" class="calendar"></div>
      <div id="home-day-detail" class="res-day-detail hidden">
        <h3 id="home-detail-date"></h3>
        <div id="home-detail-content"></div>
      </div>
    </div>

    <!-- 버스 기사 장부 -->
    <div id="tab-bus" class="tab-panel">
      <div class="panel-toolbar">
        <div class="date-nav">
          <button class="btn-icon" id="bus-prev-day" title="전날">◀</button>
          <input type="date" id="bus-date" class="date-input">
          <button class="btn-icon" id="bus-next-day" title="다음날">▶</button>
          <button class="btn-outline-sm" id="bus-today">오늘</button>
        </div>
        <button class="btn-primary" id="btn-add-bus">+ 버스 추가</button>
      </div>

      <div class="day-summary" id="bus-day-summary">
        <div class="summary-item">
          <span class="summary-label">버스 수</span>
          <span class="summary-value" id="summary-count">0대</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">총 판매</span>
          <span class="summary-value" id="summary-sales">0원</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">총 수고비(현금)</span>
          <span class="summary-value" id="summary-commission">0원</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">총 인원</span>
          <span class="summary-value" id="summary-passengers">0명</span>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="ledger-table" id="bus-table">
          <thead>
            <tr>
              <th class="col-seq">#</th>
              <th class="col-band">밴드</th>
              <th class="col-company">버스회사</th>
              <th class="col-driver">기사명</th>
              <th class="col-phone">전화번호</th>
              <th class="col-from">출발지</th>
              <th class="col-pax">인원</th>
              <th class="col-amount">판매금액</th>
              <th class="col-amount">수고비(현금)</th>
              <th class="col-goods">수고비(물건)</th>
              <th class="col-memo">메모</th>
              <th class="col-photo">사진</th>
              <th class="col-actions">관리</th>
            </tr>
          </thead>
          <tbody id="bus-tbody">
            <tr class="empty-row"><td colspan="13">이날 기록이 없습니다. 버스를 추가하세요.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 예약/일정 -->
    <div id="tab-reservation" class="tab-panel">
      <div class="panel-toolbar">
        <div class="date-nav">
          <button class="btn-icon" id="res-prev-month">◀</button>
          <span id="res-month-label" class="month-label"></span>
          <button class="btn-icon" id="res-next-month">▶</button>
        </div>
        <button class="btn-primary" id="btn-add-reservation">+ 예약 추가</button>
      </div>
      <div id="res-calendar" class="calendar"></div>
      <div id="res-day-detail" class="res-day-detail hidden">
        <h3 id="res-detail-date"></h3>
        <div id="res-detail-list"></div>
      </div>
    </div>

    <!-- 사입 장부 -->
    <div id="tab-purchase" class="tab-panel">
      <div class="panel-toolbar">
        <div class="date-nav">
          <button class="btn-icon" id="pur-prev-month">◀</button>
          <input type="month" id="pur-month" class="date-input">
          <button class="btn-icon" id="pur-next-month">▶</button>
        </div>
        <button class="btn-primary" id="btn-add-purchase">+ 사입 추가</button>
      </div>
      <div class="month-total-bar" id="pur-total-bar">
        <span>이번달 총 사입액: </span>
        <strong id="pur-total">0원</strong>
      </div>
      <div id="purchase-list" class="entry-list"></div>
    </div>

    <!-- 수입/지출 -->
    <div id="tab-cashflow" class="tab-panel">
      <div class="panel-toolbar">
        <div class="date-nav">
          <button class="btn-icon" id="cf-prev-day">◀</button>
          <input type="date" id="cf-date" class="date-input">
          <button class="btn-icon" id="cf-next-day">▶</button>
          <button class="btn-outline-sm" id="cf-today">오늘</button>
        </div>
        <button class="btn-primary" id="btn-add-cf">+ 항목 추가</button>
      </div>
      <div class="cf-summary-bar">
        <span class="cf-sum income-color">수입: <strong id="cf-total-income">0원</strong></span>
        <span class="cf-sum expense-color">지출: <strong id="cf-total-expense">0원</strong></span>
        <span class="cf-sum">잔액: <strong id="cf-balance">0원</strong></span>
      </div>
      <div id="cashflow-list" class="entry-list"></div>
    </div>

    <!-- 밴드 관리 -->
    <div id="tab-band" class="tab-panel">
      <div class="panel-toolbar">
        <h2 class="panel-title">밴드 관리</h2>
        <button class="btn-primary" id="btn-add-band">+ 밴드 추가</button>
      </div>
      <div id="band-grid" class="band-grid"></div>
    </div>

    <!-- 검색 -->
    <div id="tab-search" class="tab-panel">
      <div class="search-bar-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="기사명, 전화번호, 버스회사, 밴드명으로 검색...">
        <button class="btn-primary" id="btn-search">검색</button>
      </div>
      <p class="search-hint">버스 기사 장부 전체에서 검색합니다.</p>
      <div id="search-results" class="search-results"></div>
    </div>

  </main>
</div>

<!-- 모달 -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="btn-icon modal-close-btn" id="btn-modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- 토스트 알림 -->
<div id="toast" class="toast hidden"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/bands.js"></script>
<script src="js/home.js"></script>
<script src="js/bus-ledger.js"></script>
<script src="js/reservation.js"></script>
<script src="js/purchase.js"></script>
<script src="js/cashflow.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>

</body>
</html>
